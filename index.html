    <script>
        // Guard to prevent "Cannot set property fetch of #<Window> which has only a getter"
        (function() {
            try {
                var origFetch = window.fetch;
                var currentFetch = origFetch;
                Object.defineProperty(window, 'fetch', {
                    get: function() { return currentFetch; },
                    set: function(val) { currentFetch = val; },
                    configurable: true,
                    enumerable: true
                });
            } catch (e) {
                console.warn('[FetchGuard] Failed to configure fetch wrapper:', e);
            }
        })();
    </script>
