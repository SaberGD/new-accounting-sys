<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Beautiful Ember Gradient -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#emberGrad)" />
  <!-- Text SG -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="190" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-5">SG</text>
  <!-- Academy Subtext -->
  <text x="50%" y="78%" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="36" fill="rgba(255,255,255,0.7)" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">ACADEMY</text>
</svg>
