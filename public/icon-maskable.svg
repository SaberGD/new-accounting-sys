  <text x="50%" y="50%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="180" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-5">SG</text>
  <text x="50%" y="72%" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="32" fill="rgba(255,255,255,0.7)" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">ACADEMY</text>
</svg>
