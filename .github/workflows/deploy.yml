name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore security rules when configured
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning::FIREBASE_TOKEN is missing; skipping Firestore rules deploy."
            exit 0
          fi
          firebase deploy --only firestore:rules --force --project crm---acounting-sg

      - name: Deploy dist to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./

      # ---- AI summary Cloud Function (aiSummarizeAnalysis) ----
      # Deploys ONLY the aiSummarizeAnalysis function, never Firestore rules.
      # Runs after the site is live so a Firebase problem never blocks the
      # website deploy. Auth uses a service account JSON key stored in the
      # FIREBASE_SERVICE_ACCOUNT GitHub secret; skipped when it is missing.
      - name: Check Firebase credentials
        id: firebase_creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is missing; skipping AI function deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install functions dependencies
        if: steps.firebase_creds.outputs.enabled == 'true'
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        if: steps.firebase_creds.outputs.enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      # ---- Training access sync (syncBookingToTraining + reconcileTrainingAccess) ----
      # The Firebase CLI needs every secret referenced in functions/ to exist,
      # even when deploying a single function, so this runs before any function
      # deploy. When the GitHub secret is not configured yet a random
      # placeholder is stored (the training endpoint rejects it, so the sync
      # stays inactive) and the training sync deploy below is skipped.
      - name: Sync ACCOUNTING_SYNC_KEY into Firebase Secrets
        id: training_sync
        if: steps.firebase_creds.outputs.enabled == 'true'
        env:
          ACCOUNTING_SYNC_KEY: ${{ secrets.ACCOUNTING_SYNC_KEY }}
        run: |
          if [ -n "$ACCOUNTING_SYNC_KEY" ]; then
            CURRENT=$(firebase functions:secrets:access ACCOUNTING_SYNC_KEY --project crm---acounting-sg 2>/dev/null || true)
            if [ "$CURRENT" != "$ACCOUNTING_SYNC_KEY" ]; then
              printf '%s' "$ACCOUNTING_SYNC_KEY" | firebase functions:secrets:set ACCOUNTING_SYNC_KEY \
                --data-file=- --project crm---acounting-sg --non-interactive --force
            else
              echo "ACCOUNTING_SYNC_KEY is already up to date."
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            if ! firebase functions:secrets:access ACCOUNTING_SYNC_KEY --project crm---acounting-sg >/dev/null 2>&1; then
              echo "::warning::ACCOUNTING_SYNC_KEY is missing; storing a placeholder so other functions can deploy."
              openssl rand -hex 32 | tr -d '\n' | firebase functions:secrets:set ACCOUNTING_SYNC_KEY \
                --data-file=- --project crm---acounting-sg --non-interactive --force
            fi
            echo "::warning::ACCOUNTING_SYNC_KEY GitHub secret is missing; skipping the training sync functions deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync GROQ_API_KEY into Firebase Secrets
        if: steps.firebase_creds.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY GitHub secret is missing; the AI summary function cannot be deployed."
            exit 1
          fi
          # Only add a new secret version when the value actually changed.
          CURRENT=$(firebase functions:secrets:access GROQ_API_KEY --project crm---acounting-sg 2>/dev/null || true)
          if [ "$CURRENT" != "$GROQ_API_KEY" ]; then
            printf '%s' "$GROQ_API_KEY" | firebase functions:secrets:set GROQ_API_KEY \
              --data-file=- --project crm---acounting-sg --non-interactive --force
          else
            echo "GROQ_API_KEY is already up to date."
          fi

      - name: Deploy AI summary Cloud Function
        if: steps.firebase_creds.outputs.enabled == 'true'
        run: firebase deploy --only functions:aiSummarizeAnalysis --project crm---acounting-sg --non-interactive --force

      - name: Deploy training sync Cloud Functions
        if: always() && steps.training_sync.outputs.enabled == 'true'
        run: |
          firebase deploy \
            --only functions:syncBookingToTraining,functions:reconcileTrainingAccess \
            --project crm---acounting-sg --non-interactive --force

      - name: Remove Google Cloud key
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
